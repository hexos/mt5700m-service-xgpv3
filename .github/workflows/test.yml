name: cargo test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked --verbose
      - name: Build release (same command as OpenWrt rust-package.mk)
        run: cargo install --locked --profile release --path . --root "$RUNNER_TEMP/install"
